<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Netcom — Coming Soon</title>
<meta name="description" content="Netcom is under construction. We're building something great — check back soon.">
<meta name="theme-color" content="#05060a">
<meta name="format-detection" content="telephone=no">
<style>
  :root{
    --bg:#05060a;
    --stroke:rgba(255,255,255,.10);
    --text:#eef2ff;
    --muted:#98a2b8;
    --brand:#4f7cff;
    --brand2:#22d3ee;
    --accent:#a855f7;
    --pad: clamp(16px, 4vw, 24px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent}
  html{ -webkit-text-size-adjust: 100%; text-size-adjust: 100% }
  html,body{min-height:100%}
  body{
    margin:0;
    padding:
      max(var(--pad), env(safe-area-inset-top))
      max(var(--pad), env(safe-area-inset-right))
      max(var(--pad), env(safe-area-inset-bottom))
      max(var(--pad), env(safe-area-inset-left));
    min-height:100svh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    background:var(--bg);
    color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    overflow-wrap:anywhere;
  }

  /* ---------- animated background ---------- */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:float 18s ease-in-out infinite;will-change:transform}
  .orb.a{width:520px;height:520px;background:#2b57ff;top:-180px;left:-140px}
  .orb.b{width:460px;height:460px;background:#00d3f2;bottom:-200px;right:-140px;animation-delay:-6s}
  .orb.c{width:380px;height:380px;background:#8b5cf6;top:45%;left:62%;animation-delay:-12s;opacity:.35}
  @keyframes float{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    50%{transform:translate3d(0,-44px,0) scale(1.08)}
  }
  .grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 72%);
    mask-image:radial-gradient(ellipse at center,#000 25%,transparent 72%);
  }

  /* ---------- card ---------- */
  .card{
    width:100%;
    max-width:760px;
    text-align:center;
    padding:clamp(24px,5vw,56px) clamp(18px,4.5vw,48px);
    border-radius:clamp(20px,4vw,28px);
    border:1px solid var(--stroke);
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 40px 90px -40px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.08);
    animation:rise .8s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

  .logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:22px}
  .mark{
    width:clamp(40px,10vw,46px);
    height:clamp(40px,10vw,46px);
    border-radius:14px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    box-shadow:0 12px 30px -12px var(--brand);
    flex:0 0 auto;
  }
  .mark svg{width:55%;height:55%}
  .brand{font-weight:800;letter-spacing:.2em;font-size:clamp(.9rem,2.6vw,1rem)}
  .brand span{color:var(--brand2)}

  .pill{
    display:inline-flex;align-items:center;gap:8px;
    padding:7px 14px;margin-bottom:18px;border-radius:99px;
    font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:#c7d2fe;background:rgba(79,124,255,.12);border:1px solid rgba(79,124,255,.35);
    max-width:100%;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;background:var(--brand2);
    animation:pulse 2s infinite;flex:0 0 auto;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(34,211,238,.7)}
    70%{box-shadow:0 0 0 9px rgba(34,211,238,0)}
    100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}
  }

  h1{
    margin:0 0 14px;
    font-size:clamp(1.7rem,6.5vw,3.1rem);
    line-height:1.12;
    letter-spacing:-.025em;
    font-weight:800;
  }
  .grad{
    background:linear-gradient(100deg,var(--brand2),var(--brand) 45%,var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{
    margin:0 auto 28px;max-width:46ch;
    color:var(--muted);font-size:clamp(.92rem,2.6vw,1.05rem);line-height:1.65;
    padding:0 4px;
  }

  /* ---------- countdown ---------- */
  .countdown{
    display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
    max-width:460px;margin:0 auto 22px;width:100%;
  }
  .unit{
    padding:14px 6px;border-radius:16px;min-width:0;
    background:rgba(255,255,255,.045);border:1px solid var(--stroke);
  }
  .num{
    font-size:clamp(1.25rem,5.5vw,2rem);font-weight:800;line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  }
  .label{
    margin-top:7px;font-size:clamp(.55rem,2vw,.63rem);letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);font-weight:600;
  }

  /* ---------- progress ---------- */
  .progress{max-width:460px;margin:0 auto 26px;width:100%}
  .track{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .fill{
    height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--brand),var(--brand2));
    box-shadow:0 0 18px rgba(79,124,255,.75);
    transition:width 1.2s cubic-bezier(.2,.8,.2,1);
  }
  .meta{
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    margin-top:9px;font-size:.72rem;color:var(--muted);
  }

  /* ---------- form ---------- */
  form{display:flex;gap:10px;flex-wrap:wrap;max-width:460px;margin:0 auto;width:100%}
  input{
    flex:1 1 220px;min-width:0;
    padding:14px 16px;border-radius:14px;
    border:1px solid var(--stroke);background:rgba(255,255,255,.05);
    color:var(--text);font-size:16px; /* prevents iOS zoom on focus */
    font-family:inherit;outline:none;
    transition:border-color .2s,box-shadow .2s,background .2s;
    min-height:48px;
  }
  input::placeholder{color:#7b869c}
  input:focus{
    border-color:rgba(79,124,255,.75);
    background:rgba(255,255,255,.07);
    box-shadow:0 0 0 4px rgba(79,124,255,.15);
  }
  button{
    flex:0 0 auto;padding:14px 24px;border:0;border-radius:14px;
    font:inherit;font-weight:800;font-size:.95rem;color:#05060a;cursor:pointer;
    background:linear-gradient(135deg,var(--brand2),var(--brand));
    box-shadow:0 14px 34px -14px var(--brand);
    transition:transform .15s,filter .2s;
    min-height:48px;
    touch-action:manipulation;
  }
  button:hover{filter:brightness(1.08);transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button:focus-visible{outline:2px solid var(--brand2);outline-offset:3px}

  .msg{min-height:1.3rem;margin:12px 0 0;font-size:.85rem;font-weight:600}
  .msg.ok{color:#4ade80}
  .msg.err{color:#f87171}

  /* ---------- socials ---------- */
  .socials{display:flex;justify-content:center;gap:12px;margin-top:28px;flex-wrap:wrap}
  .socials a{
    width:44px;height:44px;display:grid;place-items:center;
    border-radius:12px;border:1px solid var(--stroke);
    background:rgba(255,255,255,.04);color:var(--muted);
    transition:color .2s,border-color .2s,background .2s,transform .2s;
    touch-action:manipulation;
  }
  .socials a:hover{
    color:#fff;transform:translateY(-2px);
    border-color:rgba(79,124,255,.6);background:rgba(79,124,255,.12);
  }
  .socials a:active{transform:scale(.94)}
  .socials svg{width:18px;height:18px}

  footer{font-size:.78rem;color:#5f6a80;text-align:center;padding:0 4px}

  /* ---------- tablet & below ---------- */
  @media (max-width:640px){
    body{gap:14px}
    .sub{margin-bottom:24px}
    .meta{justify-content:center}
  }

  /* ---------- small phones ---------- */
  @media (max-width:420px){
    .countdown{gap:7px}
    .unit{padding:11px 4px;border-radius:13px}
    .label{margin-top:5px;letter-spacing:.08em}
    form{gap:8px}
    button{flex:1 1 100%}
    .socials{gap:10px;margin-top:22px}
    .socials a{width:42px;height:42px}
    .pill{font-size:.62rem;padding:6px 11px;letter-spacing:.1em}
    .logo{margin-bottom:18px;gap:10px}
  }

  /* ---------- very small phones ---------- */
  @media (max-width:340px){
    .countdown{grid-template-columns:repeat(2,1fr);gap:8px}
    .unit{padding:12px 6px}
    h1{font-size:1.55rem}
  }

  /* ---------- landscape phones ---------- */
  @media (max-height:520px) and (orientation:landscape){
    body{justify-content:flex-start;padding-top:16px;padding-bottom:16px;gap:12px}
    .card{padding:22px 24px}
    h1{font-size:1.6rem;margin-bottom:8px}
    .sub{margin-bottom:16px;font-size:.9rem}
    .countdown{margin-bottom:14px}
    .progress{margin-bottom:16px}
    .socials{margin-top:16px}
    .logo{margin-bottom:14px}
    .pill{margin-bottom:12px}
  }

  /* ---------- reduced motion ---------- */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }

  /* ---------- dark mode input autofill fix ---------- */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus{
    -webkit-text-fill-color:var(--text);
    -webkit-box-shadow:0 0 0 1000px rgba(255,255,255,.05) inset;
    transition:background-color 9999s ease-in-out 0s;
  }
</style>
</head>
<body>

  <div class="bg" aria-hidden="true">
    <div class="orb a"></div>
    <div class="orb b"></div>
    <div class="orb c"></div>
    <div class="grid"></div>
  </div>

  <main class="card">
    <div class="logo">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#05060a" stroke-width="2.2" stroke-linecap="round">
          <circle cx="12" cy="12" r="2.2" fill="#05060a" stroke="none"/>
          <path d="M7.9 16.1a5.8 5.8 0 0 1 0-8.2M16.1 7.9a5.8 5.8 0 0 1 0 8.2"/>
          <path d="M4.7 19.3a10.3 10.3 0 0 1 0-14.6M19.3 4.7a10.3 10.3 0 0 1 0 14.6"/>
        </svg>
      </div>
      <div class="brand">NET<span>COM</span></div>
    </div>

    <div class="pill"><span class="dot"></span>Under construction</div>

    <h1>We're building<br><span class="grad">something fast.</span></h1>
    <p class="sub">
      Netcom is getting a brand-new home. We're wiring up faster connections,
      better coverage and a cleaner experience — it won't be long now.
    </p>

    <div class="countdown" aria-label="Time until launch">
      <div class="unit"><div class="num" id="days">00</div><div class="label">Days</div></div>
      <div class="unit"><div class="num" id="hours">00</div><div class="label">Hours</div></div>
      <div class="unit"><div class="num" id="mins">00</div><div class="label">Mins</div></div>
      <div class="unit"><div class="num" id="secs">00</div><div class="label">Secs</div></div>
    </div>

    <div class="progress">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="meta">
        <span id="pct">0% complete</span>
        <span id="eta">Launching soon</span>
      </div>
    </div>

    <form id="notify" novalidate>
      <input id="email" type="email" placeholder="you@company.com"
             aria-label="Email address" autocomplete="email" inputmode="email" required>
      <button type="submit">Notify me</button>
    </form>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>

    <div class="socials">
      <a href="#" aria-label="Netcom on X" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.6 8.7L23 22h-6.9l-5.4-7-6.2 7H1.4l8.1-9.3L1 2h7l4.9 6.4L18.9 2Zm-1.2 18h1.7L6.4 3.8H4.6L17.7 20Z"/></svg>
      </a>
      <a href="#" aria-label="Netcom on LinkedIn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9h4v12H3V9Zm6.5 0h3.8v1.7h.05c.53-.95 1.83-1.95 3.77-1.95 4.03 0 4.78 2.5 4.78 5.75V21h-4v-5.6c0-1.34-.03-3.06-1.9-3.06-1.9 0-2.2 1.45-2.2 2.96V21h-4V9Z"/></svg>
      </a>
      <a href="#" aria-label="Netcom on Instagram" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
    </div>
  </main>

  <footer>© <span id="year">2026</span> Netcom. All rights reserved.</footer>

<script>
  /* ============ CONFIG — change these two dates ============ */
  const LAUNCH = new Date('2027-01-15T09:00:00'); // go-live date
  const START  = new Date('2026-08-01T09:00:00'); // when work started (for the progress bar)
  /* ========================================================= */

  const daysEl  = document.getElementById('days');
  const hoursEl = document.getElementById('hours');
  const minsEl  = document.getElementById('mins');
  const secsEl  = document.getElementById('secs');
  const fillEl  = document.getElementById('fill');
  const pctEl   = document.getElementById('pct');
  const etaEl   = document.getElementById('eta');

  const pad = n => String(n).padStart(2, '0');

  function tick() {
    const diff = Math.max(0, LAUNCH - Date.now());
    const s = Math.floor(diff / 1000);
    daysEl.textContent  = pad(Math.floor(s / 86400));
    hoursEl.textContent = pad(Math.floor((s % 86400) / 3600));
    minsEl.textContent  = pad(Math.floor((s % 3600) / 60));
    secsEl.textContent  = pad(s % 60);
  }

  function progress() {
    const total = LAUNCH - START;
    const done  = total > 0 ? Math.min(Math.max((Date.now() - START) / total, 0), 1) : 1;
    fillEl.style.width = (done * 100).toFixed(1) + '%';
    pctEl.textContent  = Math.round(done * 100) + '% complete';
    etaEl.textContent  = LAUNCH > Date.now()
      ? 'Launching ' + LAUNCH.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })
      : 'Launching any moment';
  }

  tick(); progress();
  setInterval(tick, 1000);
  setTimeout(progress, 150);

  /* ---------- email form ---------- */
  const form  = document.getElementById('notify');
  const email = document.getElementById('email');
  const msg   = document.getElementById('msg');

  form.addEventListener('submit', e => {
    e.preventDefault();
    const value = email.value.trim();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value);

    if (!valid) {
      msg.textContent = 'Please enter a valid email address.';
      msg.className = 'msg err';
      email.focus();
      return;
    }

    msg.textContent = `Thanks! We'll email ${value} the moment we launch.`;
    msg.className = 'msg ok';
    form.reset();

    // TODO: send `value` to your backend / Mailchimp / Google Sheet here
  });

  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
